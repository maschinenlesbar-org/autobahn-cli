name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# One run per branch or PR: a newer push supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Tests run against the compiled output in dist/ (the `pretest` hook builds
      # first, so this also re-validates the build).
      - name: Test
        run: npm test

  # The API docs and the website's command reference are otherwise built only by
  # docs.yml on a tag, after the release: a TypeDoc warning or a break in the
  # reference generator would surface only once the release is out.
  docs:
    name: API docs & command reference
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install
        run: npm ci

      # TypeDoc runs from its own lockfile-pinned toolchain (TypeScript 6 compiler API).
      - name: Install docs toolchain
        run: npm ci --prefix tools/docs

      - name: Build
        run: npm run build

      - name: Build API docs (warnings fail the job)
        run: npm run docs -- --treatWarningsAsErrors

      - name: Generate the command reference
        working-directory: site
        run: node scripts/cli-reference.mjs
